name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease -PbuildNumber=${{ github.run_number }} --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Bitweather-1.0.${{ github.run_number }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Bitweather 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: "true"
          files: android/Bitweather-1.0.${{ github.run_number }}.apk
          body: |
            Download **Bitweather-1.0.${{ github.run_number }}.apk** below on your Android phone and open it to install or update.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
